<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg-0:#07040A; --bg-1:#120B18; --bg-2:#1B1024;
  --blue-2:#5B7CFF; --orange:#FF7A1A; --orange-2:#FFB238;
  --ink:#FFFFFF; --ink-dim:#C9C6DA; --muted:#8B87A6; --green:#3ECF6E;
  --font:Arial,Helvetica,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg-0);color:var(--ink);font-family:var(--font);min-height:100vh;min-height:100dvh;
  position:relative;overflow-x:hidden;}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,122,26,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,122,26,.035) 1px,transparent 1px);
  background-size:38px 38px;}
a{color:inherit;text-decoration:none;}
.hdr{background:rgba(6,4,10,.97);backdrop-filter:blur(14px);position:sticky;top:0;z-index:100;height:58px;
  padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,122,26,.2);}
.brand-logo{height:26px;width:auto;}
.back{font-size:.8rem;font-weight:800;color:var(--ink-dim);}
.back:hover{color:var(--orange-2);}

.wrap{max-width:640px;margin:0 auto;padding:26px 16px 60px;position:relative;z-index:1;}
h1{font-size:1.25rem;font-weight:900;text-transform:uppercase;margin-bottom:18px;}

/* -------- filtros -------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
.filter-field{flex:1;min-width:130px;display:flex;flex-direction:column;gap:5px;}
.filter-field label{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);}
.filter-field input{background:var(--bg-1);border:1px solid rgba(255,255,255,.12);border-radius:8px;
  padding:10px 12px;color:var(--ink);font-family:var(--font);font-size:.82rem;outline:none;transition:border-color .2s;}
.filter-field input:focus{border-color:var(--orange);}
.filter-clear{align-self:flex-end;background:none;border:1px solid rgba(255,255,255,.15);color:var(--ink-dim);
  border-radius:8px;padding:10px 14px;font-family:var(--font);font-size:.76rem;font-weight:800;cursor:pointer;}
.filter-clear:hover{border-color:var(--orange);color:var(--orange-2);}

.search-box{position:relative;margin-bottom:22px;}
.search-box input{width:100%;background:var(--bg-1);border:1px solid rgba(255,255,255,.1);border-radius:24px;
  padding:12px 42px 12px 18px;color:var(--ink);font-family:var(--font);font-size:.85rem;outline:none;transition:border-color .2s;}
.search-box input:focus{border-color:var(--orange);}
.search-box svg{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);}

.section-title{font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:.7px;
  color:var(--muted);margin-bottom:14px;}
.section-title span.count{color:var(--orange-2);}

/* -------- lista -------- */
.order{background:linear-gradient(160deg,var(--bg-2),var(--bg-1));border:1px solid rgba(255,255,255,.08);
  border-left:3px solid var(--orange);border-radius:10px;padding:16px 18px;margin-bottom:12px;}
.order-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.order-pkg{font-size:1rem;font-weight:900;}
.order-total{font-family:var(--font);font-weight:900;color:var(--orange-2);font-size:1.05rem;}
.order-meta{font-size:.76rem;color:var(--muted);margin-top:6px;line-height:1.6;}
.order-code{margin-top:8px;font-size:.82rem;font-weight:900;color:var(--orange-2);background:rgba(255,122,26,.08);
  border:1px solid rgba(255,122,26,.25);border-radius:6px;padding:8px 10px;display:inline-block;word-break:break-all;}
.badge{display:inline-block;font-size:.62rem;font-weight:900;text-transform:uppercase;letter-spacing:.5px;
  padding:3px 9px;border-radius:20px;margin-top:8px;}
.badge.pendiente{background:rgba(255,178,56,.12);color:var(--orange-2);border:1px solid rgba(255,178,56,.3);}
.badge.confirmado{background:rgba(62,207,110,.12);color:var(--green);border:1px solid rgba(62,207,110,.3);}
.badge.entregado{background:rgba(91,124,255,.12);color:var(--blue-2);border:1px solid rgba(91,124,255,.3);}
.empty{text-align:center;padding:50px 20px;color:var(--muted);}
.empty a{color:var(--orange-2);font-weight:800;}
.loading{text-align:center;padding:40px;color:var(--muted);font-size:.85rem;}

/* -------- menú ☰ compartido (todas las funciones) -------- */
.hdr-actions{display:flex;align-items:center;gap:.6rem;}
.hdr-greet{font-size:.78rem;font-weight:900;color:var(--orange-2);white-space:nowrap;}
.navtog{display:flex;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:8px;
  width:36px;height:36px;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;flex:none;}
.navtog span{width:16px;height:2.5px;background:#FF6347;border-radius:2px;}
.nav{position:fixed;inset:0 0 auto 0;width:100%;background:var(--bg-1);
  padding:5.5rem 1.6rem 2.4rem;transform:translateY(-100%);transition:transform .32s ease;
  border-bottom:2px solid var(--orange);max-height:100vh;overflow-y:auto;z-index:299;}
.nav.open{transform:translateY(0);}
.nav-close{position:absolute;top:1rem;right:1.2rem;width:38px;height:38px;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.18);border-radius:8px;color:var(--ink);font-size:1.3rem;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;}
.nav-section{max-width:520px;margin:0 auto 1.6rem;}
.nav-section-title{font-size:.68rem;font-weight:900;text-transform:uppercase;letter-spacing:.12em;
  color:var(--muted);margin-bottom:.8rem;}
.nav-link{display:block;width:100%;text-align:left;background:none;border:none;font-family:inherit;
  font-size:1.02rem;font-weight:800;color:var(--ink-dim);padding:.65rem 0;cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,.06);}
.nav-link:hover{color:var(--orange-2);}
.nav-link--danger:hover{color:#ff8080;}
.nav-account-email{font-size:.78rem;color:var(--muted);padding-bottom:.6rem;word-break:break-all;}
</style>

<style id="tema">
/* FariPlay — tema oscuro azul marino + naranja tomate */

 --blue:#3F86F2;--blue-2:#5B9BFF;--blue-glow:#3F86F2;--cyan:#5B9BFF;--orange:#E04A2B;--orange-2:#FF8A65;--red:#FF5A4D;--green:#3ECF6E;--navy:#08111F;--line:#25344E;

/* menú ☰ (igual que en el inicio) */
.nav{position:fixed!important;inset:auto!important;top:66px!important;right:16px!important;left:auto!important;width:min(320px,calc(100vw - 32px))!important;
 transform:none!important;display:none;background:#13213A!important;color:var(--ink)!important;border:1px solid var(--line)!important;border-radius:12px;
 box-shadow:0 20px 50px -18px rgba(0,0,0,.7);padding:8px 18px 16px!important;max-height:calc(100vh - 90px);overflow:auto;z-index:299}

/* tarjetas con acento de color */
.co-card,.balance-card,.profile-card,.card,.state-card,.step-box{border-top:3px solid var(--blue)!important}
.order{border-left:4px solid var(--orange)!important}

.balance-label{color:#CFE0FA!important}.balance-value{color:#fff!important}

.svc-icon{background-color:rgba(63,134,242,.15)!important;color:var(--blue-2)!important;border:1px solid rgba(63,134,242,.35)!important}

.metodo-btn.selected,.banco-btn.selected,.amount-chip.selected,.filter-chip.active,.tab.active{border-color:var(--blue-2)!important;background:rgba(63,134,242,.16)!important;color:#fff!important}
/* botones naranja tomate */
.btn--fire,.btn-ok,.prod-buy,.wallet-btn,.ov-btn,.success-btn,.save-btn,.price-save,.cat-import-btn,.live-search-btn,.wa-popup-btn{
 background:var(--orange)!important;color:#fff!important;border:none;border-radius:8px;box-shadow:none!important;font-weight:700}
.btn--fire:hover,.btn-ok:hover:not(:disabled),.prod-buy:hover{background:#F0583A!important;transform:none}
.btn-ok:disabled,.btn--fire:disabled{background:#2A3A55!important;color:#7C8CA5!important}
.validate-btn{background:rgba(224,74,43,.14)!important;color:#FF8A65!important;border:1px solid var(--orange)!important;font-weight:700;border-radius:8px}
.validate-btn:hover:not(:disabled){background:var(--orange)!important;color:#fff!important}
/* aviso de verificación (pago) */
.notice{display:flex;gap:12px;align-items:flex-start;background:rgba(224,74,43,.1);border:1px solid rgba(224,74,43,.4);border-left:5px solid var(--orange);border-radius:10px;padding:13px 14px}
.notice svg{width:20px;height:20px;flex:none;margin-top:1px}
.notice b{display:block;color:#FFB199;font-size:.88rem;margin-bottom:3px}
.notice p{color:#E6C9BF;font-size:.8rem;line-height:1.5}
</style>
<style>
.code-box{margin-top:12px;padding-top:12px;border-top:1px dashed rgba(255,255,255,.15)}
.code-label{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}

<div class="wrap">
  <h1>Mis pedidos</h1>

  </div>

  <p class="section-title">Resultados <span class="count" id="ordersCount"></span></p>
  <div id="ordersList"><p class="loading">Cargando tus pedidos…</p></div>
</div>

<script>
const SUPABASE_URL = "https://zdefkvvodijmrlhxvlrr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_C0ur5kEiRQ0TYDpgtiaF8Q_w2lCVCQA";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const VAL_TOWN_URL = "https://demiacapital--0a4dc2f8a8e211f1a6ca1607ee4eb77e.web.val.run";

let TODOS_LOS_PEDIDOS = [];

function pintarPedidos(pedidos){
  const list = document.getElementById("ordersList");
  document.getElementById("ordersCount").textContent = pedidos.length ? "(" + pedidos.length + ")" : "";

  if (!pedidos.length) {
    list.innerHTML = '<p class="empty">No encontramos pedidos con esos filtros.</p>';
    return;
  }

  list.innerHTML = pedidos.map(p => {
    const fecha = new Date(p.created_at).toLocaleString("es-EC", { dateStyle: "medium", timeStyle: "short" });
    const estado = p.estado || "pendiente";
    return `
      <div class="order">
        <div class="order-top">
          <div>
            <div class="order-pkg">${p.paquete}${p.bono > 0 ? ' <small>(+' + p.bono + ' bono)</small>' : ''}</div>
            <div class="order-meta">${fecha}${p.player_id ? ' · ID jugador: ' + p.player_id : ''} · ${p.metodo_pago || ''}${p.banco ? ' · ' + p.banco : ''}</div>
            ${p.entrega_codigo ? herramientasCodigo(p.offer_name || p.paquete, p.entrega_codigo) : ((p.tipo === 'giftcard' || p.tipo === 'gamekey') && p.fazercards_order_id ? `<div class="code-btns" style="margin-top:10px"><button type="button" class="consult" data-consultar="${p.id}">Consultar código</button></div>` : '')}
          </div>
          <div class="order-total">$${Number(p.total).toFixed(2)}</div>
        </div>
        <span class="badge ${estado}">${estado}</span>
      </div>`;
  }).join('');
}

function aplicarFiltros(){
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const desde = document.getElementById("dateFrom").value;
  const hasta = document.getElementById("dateTo").value;

  let filtrados = TODOS_LOS_PEDIDOS;

  if (q) {
    filtrados = filtrados.filter(p =>
      (p.paquete || "").toLowerCase().includes(q) ||
      String(p.player_id || "").toLowerCase().includes(q)
    );
  }

  if (desde) {
    const desdeDate = new Date(desde + "T00:00:00");
    filtrados = filtrados.filter(p => new Date(p.created_at) >= desdeDate);
  }

  if (hasta) {
    const hastaDate = new Date(hasta + "T23:59:59");
    filtrados = filtrados.filter(p => new Date(p.created_at) <= hastaDate);
  }

  pintarPedidos(filtrados);
}

document.getElementById("searchInput").addEventListener("input", aplicarFiltros);
document.getElementById("dateFrom").addEventListener("change", aplicarFiltros);
document.getElementById("dateTo").addEventListener("change", aplicarFiltros);
document.getElementById("filterClear").addEventListener("click", () => {
  document.getElementById("searchInput").value = "";
  document.getElementById("dateFrom").value = "";
  document.getElementById("dateTo").value = "";
  pintarPedidos(TODOS_LOS_PEDIDOS);
});

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.href = "auth.html?redirect=mis-pedidos.html"; return; }

  const user = session.user;
  const ADMIN_EMAIL = "hfarinango2707@gmail.com";
  const email = user.email || "";
  const fullName = (user.user_metadata && user.user_metadata.full_name) || "";
  const primerNombre = (fullName || email.split("@")[0]).trim().split(" ")[0];
  document.getElementById("hdrGreet").textContent = "Hola, " + primerNombre;
  document.getElementById("navAccountEmail").textContent = email;
  if (email === ADMIN_EMAIL) document.getElementById("navAdminLink").style.display = "block";

  document.getElementById("navSalirBtn").addEventListener("click", async () => {
    await sb.auth.signOut();
    location.href = "index.html";
  });

  const { data: pedidos, error } = await sb
    .from("pedidos")
    .select("*")
    .eq("user_id", session.user.id)
    .order("created_at", { ascending: false });

  const list = document.getElementById("ordersList");

  if (error) {
    list.innerHTML = '<p class="empty">No pudimos cargar tus pedidos. Intenta de nuevo más tarde.</p>';
    return;
  }

  TODOS_LOS_PEDIDOS = pedidos || [];

  if (!TODOS_LOS_PEDIDOS.length) {
    list.innerHTML = '<p class="empty">Todavía no tienes pedidos.<br><a href="index.html#paquetes">Ver paquetes disponibles →</a></p>';
    document.getElementById("ordersCount").textContent = "";
    return;
  }

  pintarPedidos(TODOS_LOS_PEDIDOS);
})();

const navEl = document.getElementById("nav");
const navtogBtn = document.getElementById("navtog");
navtogBtn.addEventListener("click", () => {
  const open = navEl.classList.toggle("open");
  navtogBtn.setAttribute("aria-expanded", open);
});
document.getElementById("navClose").addEventListener("click", () => navEl.classList.remove("open"));
navEl.addEventListener("click", (e) => { if (e.target.closest("a")) navEl.classList.remove("open"); });

/* ---------- entregar el código al cliente final (copiar / WhatsApp / compartir) ---------- */
function herramientasCodigo(nombre, codigo){
  const att = 'data-nombre="' + String(nombre).replace(/"/g, "&quot;") + '" data-codigo="' + String(codigo).replace(/"/g, "&quot;") + '"';
  return '<div class="code-box"><div class="code-label">Código</div><div class="code-val">' + codigo + '</div>' +
    '<div class="code-tools"><input type="tel" class="code-tel" placeholder="WhatsApp del cliente (opcional) · 09XXXXXXXX">' +
    '<div class="code-btns"><button type="button" data-ca="copiar" ' + att + '>Copiar</button>' +
    '<button type="button" class="wa" data-ca="wa" ' + att + '>Enviar por WhatsApp</button>' +
    '<button type="button" data-ca="share" ' + att + '>Compartir</button></div></div></div>';
}
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-ca]"); if (!b) return;
  const nombre = b.dataset.nombre, codigo = b.dataset.codigo;
  const texto = "Hola, aquí está tu código de " + nombre + ":\n\n" + codigo + "\n\n¡Gracias por tu compra!";
  if (b.dataset.ca === "copiar") {
    try { await navigator.clipboard.writeText(codigo); b.textContent = "✓ Copiado"; } catch (_) { b.textContent = "Mantén pulsado el código"; }
    setTimeout(() => { b.textContent = "Copiar"; }, 1800);
  } else if (b.dataset.ca === "wa") {
    let n = ((b.closest(".code-tools").querySelector(".code-tel") || {}).value || "").replace(/\D/g, "");
    if (n.startsWith("0")) n = "593" + n.slice(1);
    window.open("https://wa.me/" + n + "?text=" + encodeURIComponent(texto), "_blank");
  } else if (b.dataset.ca === "share") {
    if (navigator.share) { try { await navigator.share({ text: texto }); } catch (_) {} }
    else { try { await navigator.clipboard.writeText(texto); b.textContent = "✓ Mensaje copiado"; setTimeout(() => { b.textContent = "Compartir"; }, 1800); } catch (_) {} }
  }
});

document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-consultar]"); if (!b) return;
  b.disabled = true; b.textContent = "Consultando…";
  try {
    const { data: { session } } = await sb.auth.getSession();
    const resp = await fetch(`${VAL_TOWN_URL}/?action=refresh-code`, { method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + session.access_token },
      body: JSON.stringify({ pedidoId: b.dataset.consultar }) });
    const r = await resp.json();
    if (r.ok && r.codigo) {
      const p = TODOS_LOS_PEDIDOS.find(x => String(x.id) === String(b.dataset.consultar));
      if (p) { p.entrega_codigo = r.codigo; if (r.estado) p.estado = r.estado; }
      aplicarFiltros();
    } else { b.disabled = false; b.textContent = "Aún no está listo · reintentar"; }
  } catch (_) { b.disabled = false; b.textContent = "Error · reintentar"; }
});
</script>
