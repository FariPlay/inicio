<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productos — FariPlay</title>
<meta name="theme-color" content="#07040A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%2307040A'/%3E%3Cpolygon points='14,12 34,12 50,52 30,52' fill='%23FF7A1A'/%3E%3Cpolygon points='50,12 30,12 14,52 34,52' fill='%233A5CFF'/%3E%3C/svg%3E" type="image/svg+xml">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg-0:#07040A; --bg-1:#120B18; --bg-2:#1B1024;
  --orange:#FF7A1A; --orange-2:#FFB238; --blue-2:#5B7CFF;
  --ink:#FFFFFF; --ink-dim:#C9C6DA; --muted:#8B87A6; --green:#3ECF6E;
  --font:Arial,Helvetica,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg-0);color:var(--ink);font-family:var(--font);min-height:100vh;min-height:100dvh;
  position:relative;overflow-x:hidden;}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,122,26,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,122,26,.035) 1px,transparent 1px);
  background-size:38px 38px;}
a{color:inherit;text-decoration:none;}
.hdr{background:rgba(6,4,10,.97);backdrop-filter:blur(14px);position:sticky;top:0;z-index:100;height:58px;
  padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,122,26,.2);}
.brand-logo{height:26px;width:auto;}
.back{font-size:.8rem;font-weight:800;color:var(--ink-dim);}
.back:hover{color:var(--orange-2);}

.cat-hero{position:relative;height:180px;background:radial-gradient(circle at 25% 20%,#1f2a3a,var(--bg-0));
  background-size:cover;background-position:center;display:flex;align-items:flex-end;overflow:hidden;}
.cat-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,4,10,.15) 30%,var(--bg-0) 100%);}
.cat-hero-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3.4rem;
  filter:drop-shadow(0 6px 16px rgba(0,0,0,.5));}
.cat-hero-inner{position:relative;z-index:1;padding:0 16px 16px;max-width:600px;margin:0 auto;width:100%;}
.cat-hero-type{display:inline-block;background:rgba(7,4,10,.6);backdrop-filter:blur(4px);color:var(--orange-2);
  font-size:.64rem;font-weight:900;text-transform:uppercase;letter-spacing:.5px;padding:4px 10px;border-radius:20px;
  border:1px solid rgba(255,122,26,.35);margin-bottom:8px;}
h1{font-size:1.35rem;font-weight:900;line-height:1.15;text-shadow:0 2px 8px rgba(0,0,0,.6);}

.wrap{max-width:600px;margin:0 auto;padding:20px 16px 50px;position:relative;z-index:1;}
.sub{font-size:.8rem;color:var(--muted);margin-bottom:18px;}

.prod-card{background:linear-gradient(160deg,var(--bg-2),var(--bg-1));border:1px solid rgba(255,255,255,.08);
  border-radius:12px;padding:16px 18px;margin-bottom:12px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;transition:transform .18s,border-color .18s;}
.prod-card:hover{transform:translateY(-2px);border-color:rgba(255,122,26,.4);}
.prod-name{font-size:.95rem;font-weight:900;}
.prod-badge{display:inline-block;font-size:.62rem;font-weight:900;color:var(--green);text-transform:uppercase;
  letter-spacing:.4px;margin-top:5px;background:rgba(62,207,110,.12);border:1px solid rgba(62,207,110,.3);
  padding:3px 8px;border-radius:20px;}
.prod-price{font-size:1.05rem;font-weight:900;color:var(--orange-2);white-space:nowrap;}
.prod-buy{background:linear-gradient(135deg,var(--orange-2),var(--orange));color:#1A0500;font-weight:900;
  font-size:.75rem;text-transform:uppercase;padding:9px 14px;border-radius:6px;white-space:nowrap;}

.empty{text-align:center;padding:60px 20px;color:var(--muted);}
.loading{text-align:center;padding:50px;color:var(--muted);font-size:.85rem;}
</style>
</head>
<body>

<header class="hdr">
  <a href="index.html"><img src="logo.png" alt="FariPlay" class="brand-logo" onerror="this.style.display='none'"></a>
  <a href="index.html" class="back">← Categorías</a>
</header>

<div class="cat-hero" id="catHero">
  <span class="cat-hero-icon" id="catHeroIcon"></span>
  <div class="cat-hero-inner">
    <span class="cat-hero-type" id="catHeroType"></span>
    <h1 id="catTitle">Cargando…</h1>
  </div>
</div>

<div class="wrap">
  <p class="sub" id="catSub"></p>
  <div id="prodList"><p class="loading">Cargando productos…</p></div>
</div>

<script>
const SUPABASE_URL = "https://zdefkvvodijmrlhxvlrr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_C0ur5kEiRQ0TYDpgtiaF8Q_w2lCVCQA";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const params = new URLSearchParams(location.search);
const tipo = params.get("tipo");
const categoryId = params.get("category_id");

const TIPO_LABEL = { topup: "Recarga", giftcard: "Tarjeta de regalo", gamekey: "Llave de juego" };
const TIPO_ICONO = { topup: "🎮", giftcard: "🎁", gamekey: "🔑" };

(async () => {
  if (!tipo || !categoryId) { document.getElementById("prodList").innerHTML = '<p class="empty">Categoría no válida.</p>'; return; }

  const [{ data: productos, error }, { data: metaCat }] = await Promise.all([
    sb.from("catalogo").select("*").eq("tipo", tipo).eq("category_id", categoryId).eq("activo", true).order("precio_venta", { ascending: true }),
    sb.from("catalogo_categorias").select("nombre_publico, imagen_url").eq("id", `${tipo}:${categoryId}`).maybeSingle(),
  ]);

  const list = document.getElementById("prodList");

  if (error || !productos || !productos.length) {
    list.innerHTML = '<p class="empty">No hay productos disponibles en esta categoría por ahora.</p>';
    return;
  }

  const nombreCategoria = (metaCat && metaCat.nombre_publico) || productos[0].category_name;
  document.getElementById("catTitle").textContent = nombreCategoria;
  document.getElementById("catSub").textContent = productos.length + " producto" + (productos.length === 1 ? "" : "s") + " disponible" + (productos.length === 1 ? "" : "s");
  document.getElementById("catHeroType").textContent = TIPO_LABEL[tipo] || tipo;
  document.title = nombreCategoria + " — FariPlay";

  const imagenCat = metaCat && metaCat.imagen_url;
  if (imagenCat) {
    document.getElementById("catHero").style.backgroundImage = `url('${imagenCat}')`;
  } else {
    document.getElementById("catHeroIcon").textContent = TIPO_ICONO[tipo] || "🛒";
  }

  list.innerHTML = productos.map(p => `
    <a class="prod-card" href="checkout.html?id=${encodeURIComponent(p.id)}">
      <div>
        <div class="prod-name">${p.offer_name_publico || p.offer_name}</div>
        ${p.soporta_validacion ? '<span class="prod-badge">✓ Valida tu ID</span>' : ''}
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <span class="prod-price">$${Number(p.precio_venta).toFixed(2)}</span>
        <span class="prod-buy">Comprar</span>
      </div>
    </a>`).join("");
})();
</script>
</body>
</html>
