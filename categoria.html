<!DOCTYPE html>
<html lang="es">
<head>
<meta name="color-scheme" content="dark">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productos — FariPlay</title>
<meta name="theme-color" content="#0B1F3A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%2307040A'/%3E%3Cpolygon points='14,12 34,12 50,52 30,52' fill='%23FF7A1A'/%3E%3Cpolygon points='50,12 30,12 14,52 34,52' fill='%233A5CFF'/%3E%3C/svg%3E" type="image/svg+xml">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg-0:#07040A; --bg-1:#120B18; --bg-2:#1B1024;
  --orange:#FF7A1A; --orange-2:#FFB238; --blue-2:#5B7CFF;
  --ink:#FFFFFF; --ink-dim:#C9C6DA; --muted:#8B87A6; --green:#3ECF6E;
  --font:Arial,Helvetica,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg-0);color:var(--ink);font-family:var(--font);min-height:100vh;min-height:100dvh;
  position:relative;overflow-x:hidden;}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,122,26,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,122,26,.035) 1px,transparent 1px);
  background-size:38px 38px;}
a{color:inherit;text-decoration:none;}
.hdr{background:rgba(6,4,10,.97);backdrop-filter:blur(14px);position:sticky;top:0;z-index:100;height:58px;
  padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,122,26,.2);}
.brand-logo{height:26px;width:auto;}
.back{font-size:.8rem;font-weight:800;color:var(--ink-dim);}
.back:hover{color:var(--orange-2);}

.cat-hero{position:relative;height:180px;background:radial-gradient(circle at 25% 20%,#1f2a3a,var(--bg-0));
  background-size:cover;background-position:center;display:flex;align-items:flex-end;overflow:hidden;}
.cat-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,4,10,.15) 30%,var(--bg-0) 100%);}
.cat-hero-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.18);}
.cat-hero-icon svg{width:64px;height:64px;}
.cat-hero-inner{position:relative;z-index:1;padding:0 16px 16px;max-width:600px;margin:0 auto;width:100%;}
.cat-hero-type{display:inline-block;background:rgba(7,4,10,.6);backdrop-filter:blur(4px);color:var(--orange-2);
  font-size:.64rem;font-weight:900;text-transform:uppercase;letter-spacing:.5px;padding:4px 10px;border-radius:20px;
  border:1px solid rgba(255,122,26,.35);margin-bottom:8px;}
h1{font-size:1.35rem;font-weight:900;line-height:1.15;text-shadow:0 2px 8px rgba(0,0,0,.6);}

.wrap{max-width:600px;margin:0 auto;padding:20px 16px 50px;position:relative;z-index:1;}
.sub{font-size:.8rem;color:var(--muted);margin-bottom:18px;}

.prod-card{background:linear-gradient(160deg,var(--bg-2),var(--bg-1));border:1px solid rgba(255,255,255,.08);
  border-radius:12px;padding:16px 18px;margin-bottom:12px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;transition:transform .18s,border-color .18s;}
.prod-card:hover{transform:translateY(-2px);border-color:rgba(255,122,26,.4);}
.prod-name{font-size:.95rem;font-weight:900;}
.prod-badge{display:inline-block;font-size:.62rem;font-weight:900;color:var(--green);text-transform:uppercase;
  letter-spacing:.4px;margin-top:5px;background:rgba(62,207,110,.12);border:1px solid rgba(62,207,110,.3);
  padding:3px 8px;border-radius:20px;}
.prod-price{font-size:1.05rem;font-weight:900;color:var(--orange-2);white-space:nowrap;}
.prod-buy{background:linear-gradient(135deg,var(--orange-2),var(--orange));color:#1A0500;font-weight:900;
  font-size:.75rem;text-transform:uppercase;padding:9px 14px;border-radius:6px;white-space:nowrap;}

.empty{text-align:center;padding:60px 20px;color:var(--muted);}
.loading{text-align:center;padding:50px;color:var(--muted);font-size:.85rem;}
/* -------- menú ☰ compartido (todas las funciones) -------- */
.hdr-actions{display:flex;align-items:center;gap:.6rem;}
.hdr-greet{font-size:.78rem;font-weight:900;color:var(--orange-2);white-space:nowrap;}
.navtog{display:flex;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:8px;
  width:36px;height:36px;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;flex:none;}
.navtog span{width:16px;height:2.5px;background:#FF6347;border-radius:2px;}
.nav{position:fixed;inset:0 0 auto 0;width:100%;background:var(--bg-1);
  padding:5.5rem 1.6rem 2.4rem;transform:translateY(-100%);transition:transform .32s ease;
  border-bottom:2px solid var(--orange);max-height:100vh;overflow-y:auto;z-index:299;}
.nav.open{transform:translateY(0);}
.nav-close{position:absolute;top:1rem;right:1.2rem;width:38px;height:38px;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.18);border-radius:8px;color:var(--ink);font-size:1.3rem;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;}
.nav-section{max-width:520px;margin:0 auto 1.6rem;}
.nav-section-title{font-size:.68rem;font-weight:900;text-transform:uppercase;letter-spacing:.12em;
  color:var(--muted);margin-bottom:.8rem;}
.nav-link{display:block;width:100%;text-align:left;background:none;border:none;font-family:inherit;
  font-size:1.02rem;font-weight:800;color:var(--ink-dim);padding:.65rem 0;cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,.06);}
.nav-link:hover{color:var(--orange-2);}
.nav-link--danger:hover{color:#ff8080;}
.nav-account-email{font-size:.78rem;color:var(--muted);padding-bottom:.6rem;word-break:break-all;}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="tema">
/* FariPlay — tema oscuro azul marino + naranja tomate */
:root{color-scheme:dark;--bg-0:#0B1426;--bg-1:#111E35;--bg-2:#15233B;--ink:#EAF0FA;--ink-dim:#B6C3D8;--ink-faint:#8C9BB2;--muted:#8C9BB2;
 --blue:#3F86F2;--blue-2:#5B9BFF;--blue-glow:#3F86F2;--cyan:#5B9BFF;--orange:#E04A2B;--orange-2:#FF8A65;--red:#FF5A4D;--green:#3ECF6E;--navy:#08111F;--line:#25344E;
 --font:'Manrope',Arial,Helvetica,sans-serif;--font-d:var(--font);--font-b:var(--font);--font-m:var(--font)}
body{background:radial-gradient(70% 38% at 92% 0%,rgba(63,134,242,.24),transparent 62%),radial-gradient(50% 32% at 0% 0%,rgba(224,74,43,.15),transparent 60%),#0B1426!important;color:var(--ink);font-family:var(--font)}
body::before{display:none!important}
.hdr,.site-header{background:#08111F!important;border-bottom:3px solid var(--orange)!important;backdrop-filter:none!important}
footer{background:#08111F!important}
.navtog{background:rgba(255,255,255,.08)!important;border-color:rgba(255,255,255,.2)!important}
.navtog span{background:var(--orange)!important}
.hdr-greet{color:#fff!important}
/* menú ☰ (igual que en el inicio) */
.nav{position:fixed!important;inset:auto!important;top:66px!important;right:16px!important;left:auto!important;width:min(320px,calc(100vw - 32px))!important;
 transform:none!important;display:none;background:#13213A!important;color:var(--ink)!important;border:1px solid var(--line)!important;border-radius:12px;
 box-shadow:0 20px 50px -18px rgba(0,0,0,.7);padding:8px 18px 16px!important;max-height:calc(100vh - 90px);overflow:auto;z-index:299}
.nav.open{display:block}
.nav-close{display:none!important}
.nav-section{margin:0 0 4px!important;max-width:none!important}
.nav-section-title{color:#8C9BB2!important;margin:12px 0 4px!important;font-size:.72rem!important;letter-spacing:0!important;text-transform:none!important}
.nav-link{color:#EAF0FA!important;font-size:.95rem!important;font-weight:600!important;padding:9px 0!important;border-bottom:1px solid #1F2E48!important}
.nav-link:hover{color:#8DB4F5!important}
.nav-link--danger,.nav-link--danger:hover{color:#FF8A75!important}
.nav-account-email{color:#8C9BB2!important}
/* tarjetas con acento de color */
.co-card,.balance-card,.profile-card,.card,.state-card,.step-box{border-top:3px solid var(--blue)!important}
.order{border-left:4px solid var(--orange)!important}
.balance-card{background:linear-gradient(135deg,#0B3C85,#1F6FE0)!important;border:0!important}
.balance-label{color:#CFE0FA!important}.balance-value{color:#fff!important}
.profile-avatar{background:linear-gradient(135deg,var(--blue),var(--orange))!important;color:#fff!important;box-shadow:0 0 0 4px rgba(63,134,242,.25)!important}
.svc-icon{background-color:rgba(63,134,242,.15)!important;color:var(--blue-2)!important;border:1px solid rgba(63,134,242,.35)!important}
.section-title,.step-title{color:var(--blue-2)!important}
.metodo-btn.selected,.banco-btn.selected,.amount-chip.selected,.filter-chip.active,.tab.active{border-color:var(--blue-2)!important;background:rgba(63,134,242,.16)!important;color:#fff!important}
/* botones naranja tomate */
.btn--fire,.btn-ok,.prod-buy,.wallet-btn,.ov-btn,.success-btn,.save-btn,.price-save,.cat-import-btn,.live-search-btn,.wa-popup-btn{
 background:var(--orange)!important;color:#fff!important;border:none;border-radius:8px;box-shadow:none!important;font-weight:700}
.btn--fire:hover,.btn-ok:hover:not(:disabled),.prod-buy:hover{background:#F0583A!important;transform:none}
.btn-ok:disabled,.btn--fire:disabled{background:#2A3A55!important;color:#7C8CA5!important}
.validate-btn{background:rgba(224,74,43,.14)!important;color:#FF8A65!important;border:1px solid var(--orange)!important;font-weight:700;border-radius:8px}
.validate-btn:hover:not(:disabled){background:var(--orange)!important;color:#fff!important}
/* aviso de verificación (pago) */
.notice{display:flex;gap:12px;align-items:flex-start;background:rgba(224,74,43,.1);border:1px solid rgba(224,74,43,.4);border-left:5px solid var(--orange);border-radius:10px;padding:13px 14px}
.notice svg{width:20px;height:20px;flex:none;margin-top:1px}
.notice b{display:block;color:#FFB199;font-size:.88rem;margin-bottom:3px}
.notice p{color:#E6C9BF;font-size:.8rem;line-height:1.5}
</style>
</head>
<body>

<header class="hdr">
  <a href="index.html"><img src="logo.png" alt="FariPlay" class="brand-logo" onerror="this.style.display='none'"></a>
  <div class="hdr-actions"><a href="index.html" class="back">← Catálogo</a><span class="hdr-greet" id="hdrGreet"></span>
    <button class="navtog" id="navtog" aria-label="Menú" aria-expanded="false"><span></span><span></span><span></span></button></div>
</header>

<nav class="nav" id="nav">
  <button class="nav-close" id="navClose" aria-label="Cerrar menú">✕</button>
  <div class="nav-section">
    <p class="nav-section-title">Explorar</p>
    <a href="index.html#paquetes" class="nav-link">Catálogo</a>
  </div>
  <div class="nav-section">
    <p class="nav-section-title">Mi cuenta</p>
    <p class="nav-account-email" id="navAccountEmail"></p>
    <a href="perfil.html" class="nav-link">Mi perfil</a>
    <a href="mis-pedidos.html" class="nav-link">Mis pedidos</a>
    <a href="recargar.html" class="nav-link">Recargar saldo</a>
    <a href="admin.html" class="nav-link" id="navAdminLink" style="display:none;">Panel admin</a>
    <button type="button" class="nav-link nav-link--danger" id="navSalirBtn">Cerrar sesión</button>
  </div>
</nav>

<div class="cat-hero" id="catHero">
  <span class="cat-hero-icon" id="catHeroIcon"></span>
  <div class="cat-hero-inner">
    <span class="cat-hero-type" id="catHeroType"></span>
    <h1 id="catTitle">Cargando…</h1>
  </div>
</div>

<div class="wrap">
  <p class="sub" id="catSub"></p>
  <div id="prodList"><p class="loading">Cargando productos…</p></div>
</div>

<script>
const SUPABASE_URL = "https://zdefkvvodijmrlhxvlrr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_C0ur5kEiRQ0TYDpgtiaF8Q_w2lCVCQA";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const params = new URLSearchParams(location.search);
const tipo = params.get("tipo");
const categoryId = params.get("category_id");

const TIPO_LABEL = { topup: "Recarga", giftcard: "Tarjeta de regalo", gamekey: "Llave de juego" };
const ICONO_CONTROLLER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="8" width="20" height="10" rx="5"/><path d="M7 11v4M5 13h4"/><circle cx="16" cy="11.5" r="1"/><circle cx="18.5" cy="14" r="1"/></svg>';
const ICONO_GIFT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="12" rx="1"/><path d="M3 13h18M12 9v12"/><path d="M12 9c-1.5-3-4-4-5.5-2.5S6 9 12 9c6 0 6.5-4.9 5.5-6.5S13.5 6 12 9z"/></svg>';
const ICONO_KEY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="15" r="4"/><path d="M10 12l9-9M17 5l2 2M14 8l2 2"/></svg>';
const ICONO_CART = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 3H2"/><circle cx="9" cy="20" r="1"/><circle cx="17" cy="20" r="1"/></svg>';
const TIPO_ICONO = { topup: ICONO_CONTROLLER, giftcard: ICONO_GIFT, gamekey: ICONO_KEY };

(async () => {
  if (!tipo || !categoryId) { document.getElementById("prodList").innerHTML = '<p class="empty">Categoría no válida.</p>'; return; }

  const [{ data: productos, error }, { data: metaCat }] = await Promise.all([
    sb.from("catalogo").select("*").eq("tipo", tipo).eq("category_id", categoryId).eq("activo", true).order("precio_venta", { ascending: true }),
    sb.from("catalogo_categorias").select("nombre_publico, imagen_url").eq("id", `${tipo}:${categoryId}`).maybeSingle(),
  ]);

  const list = document.getElementById("prodList");

  if (error || !productos || !productos.length) {
    list.innerHTML = '<p class="empty">No hay productos disponibles en esta categoría por ahora.</p>';
    return;
  }

  const nombreCategoria = (metaCat && metaCat.nombre_publico) || productos[0].category_name;
  document.getElementById("catTitle").textContent = nombreCategoria;
  document.getElementById("catSub").textContent = productos.length + " producto" + (productos.length === 1 ? "" : "s") + " disponible" + (productos.length === 1 ? "" : "s");
  document.getElementById("catHeroType").textContent = TIPO_LABEL[tipo] || tipo;
  document.title = nombreCategoria + " — FariPlay";

  const imagenCat = metaCat && metaCat.imagen_url;
  if (imagenCat) {
    document.getElementById("catHero").style.backgroundImage = `url('${imagenCat}')`;
  } else {
    document.getElementById("catHeroIcon").innerHTML = TIPO_ICONO[tipo] || ICONO_CART;
  }

  const NEG = {};
  const { data: { session: ses } } = await sb.auth.getSession();
  if (ses) {
    const rn = await sb.from("precios_negocio").select("catalogo_id,precio").in("catalogo_id", productos.map(p => p.id));
    (rn.data || []).forEach(x => NEG[x.catalogo_id] = Number(x.precio));
  }
  list.innerHTML = productos.map(p => `
    <a class="prod-card" href="checkout.html?id=${encodeURIComponent(p.id)}">
      <div>
        <div class="prod-name">${p.offer_name_publico || p.offer_name}</div>
        ${p.soporta_validacion ? '<span class="prod-badge">✓ Valida tu ID</span>' : ''}
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <span class="prod-price">$${Number(NEG[p.id] != null ? NEG[p.id] : p.precio_venta).toFixed(2)}</span>
        <span class="prod-buy">Comprar</span>
      </div>
    </a>`).join("");
})();
</script>
<script>
(async () => {
  const navEl = document.getElementById("nav"), tog = document.getElementById("navtog");
  tog.addEventListener("click", () => { const o = navEl.classList.toggle("open"); tog.setAttribute("aria-expanded", o); });
  navEl.addEventListener("click", (e) => { if (e.target.closest("a")) navEl.classList.remove("open"); });
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { document.getElementById("navAccountEmail").closest(".nav-section").innerHTML = '<p class="nav-section-title">Mi cuenta</p><a href="auth.html" class="nav-link">Iniciar sesión</a>'; return; }
  const u = session.user, email = u.email || "", nombre = ((u.user_metadata && u.user_metadata.full_name) || email.split("@")[0]).trim().split(" ")[0];
  document.getElementById("hdrGreet").textContent = "Hola, " + nombre;
  document.getElementById("navAccountEmail").textContent = email;
  if (email === "hfarinango2707@gmail.com") document.getElementById("navAdminLink").style.display = "block";
  document.getElementById("navSalirBtn").addEventListener("click", async () => { await sb.auth.signOut(); location.href = "index.html"; });
})();
</script>
</body>
</html>
