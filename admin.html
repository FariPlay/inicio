<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel — FariPlay</title>
<meta name="theme-color" content="#07040A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%2307040A'/%3E%3Cpolygon points='14,12 34,12 50,52 30,52' fill='%23FF7A1A'/%3E%3Cpolygon points='50,12 30,12 14,52 34,52' fill='%233A5CFF'/%3E%3C/svg%3E" type="image/svg+xml">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg-0:#07040A; --bg-1:#120B18; --bg-2:#1B1024;
  --blue:#3A5CFF; --blue-2:#5B7CFF; --orange:#FF7A1A; --orange-2:#FFB238;
  --ink:#FFFFFF; --ink-dim:#C9C6DA; --muted:#8B87A6; --green:#3ECF6E; --red:#FF3B3B;
  --font:Arial,Helvetica,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg-0);color:var(--ink);font-family:var(--font);min-height:100vh;min-height:100dvh;position:relative;overflow-x:hidden;}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,122,26,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,122,26,.035) 1px,transparent 1px);
  background-size:38px 38px;}
a{color:inherit;text-decoration:none;}
.hdr{background:rgba(7,4,10,.92);backdrop-filter:blur(16px);position:sticky;top:0;z-index:100;height:58px;
  padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--orange);}
.brand-logo{height:26px;width:auto;}
.logout{font-size:.78rem;color:var(--muted);}
.wrap{max-width:640px;margin:0 auto;padding:22px 16px 60px;position:relative;z-index:1;}

.tabs{display:flex;gap:6px;margin-bottom:20px;background:var(--bg-1);border-radius:6px;padding:4px;}
.tab{flex:1;text-align:center;padding:11px;border-radius:5px;font-size:.78rem;font-weight:900;text-transform:uppercase;
  letter-spacing:.5px;cursor:pointer;color:var(--muted);}
.tab.active{background:linear-gradient(135deg,var(--orange-2),var(--orange));color:#1A0500;}
.panel{display:none;}
.panel.active{display:block;}

/* -------- pedidos -------- */
.order{background:linear-gradient(160deg,var(--bg-2),var(--bg-1));border:1px solid rgba(255,255,255,.08);
  border-left:3px solid var(--orange);border-radius:6px;padding:15px 16px;margin-bottom:10px;}
.order-top{display:flex;justify-content:space-between;gap:10px;}
.order-pkg{font-weight:900;font-size:.98rem;}
.order-total{font-weight:900;color:var(--orange-2);}
.order-meta{font-size:.74rem;color:var(--muted);margin-top:6px;line-height:1.6;}
.order-meta a{color:var(--blue-2);font-weight:800;}
.estado-select{margin-top:10px;width:100%;background:var(--bg-0);border:1px solid rgba(255,255,255,.15);
  border-radius:5px;padding:9px 10px;color:var(--ink);font-family:var(--font);font-size:.8rem;font-weight:800;}

/* -------- badge de estado (solo lectura) -------- */
.badge{display:inline-block;font-size:.62rem;font-weight:900;text-transform:uppercase;letter-spacing:.5px;
  padding:4px 10px;border-radius:20px;margin-top:8px;}
.badge.pendiente{background:rgba(255,178,56,.12);color:var(--orange-2);border:1px solid rgba(255,178,56,.3);}
.badge.confirmado{background:rgba(62,207,110,.12);color:var(--green);border:1px solid rgba(62,207,110,.3);}
.badge.entregado{background:rgba(91,124,255,.12);color:var(--blue-2);border:1px solid rgba(91,124,255,.3);}
.badge.rechazado{background:rgba(255,59,59,.12);color:#ff8080;border:1px solid rgba(255,59,59,.3);}

/* -------- fila resumen clicable + detalle expandible -------- */
.order-top{cursor:pointer;}
.order-toggle{display:flex;align-items:center;gap:8px;}
.chev{width:14px;height:14px;flex:none;color:var(--muted);transition:transform .2s;}
.order.open .chev{transform:rotate(180deg);}
.order-detail{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed rgba(255,255,255,.12);}
.order.open .order-detail{display:block;}
.detail-row{display:flex;justify-content:space-between;gap:10px;font-size:.78rem;padding:6px 0;
  border-bottom:1px solid rgba(255,255,255,.06);color:var(--ink-dim);}
.detail-row:last-of-type{border-bottom:none;}
.detail-row b{color:var(--ink);text-align:right;}
.detail-img{max-width:100%;border-radius:8px;margin-top:10px;display:block;}
.edit-toggle{margin-top:12px;background:rgba(91,124,255,.12);border:1px solid rgba(91,124,255,.3);color:var(--blue-2);
  border-radius:6px;padding:8px 14px;font-family:var(--font);font-weight:800;font-size:.76rem;cursor:pointer;}
.edit-panel{display:none;margin-top:10px;gap:8px;align-items:center;}
.edit-panel.open{display:flex;}
.edit-panel select{flex:1;background:var(--bg-0);border:1px solid rgba(255,255,255,.15);border-radius:5px;
  padding:9px 10px;color:var(--ink);font-family:var(--font);font-size:.8rem;font-weight:800;}
.save-btn{background:linear-gradient(135deg,var(--orange-2),var(--orange));color:#1A0500;border:none;border-radius:6px;
  padding:9px 16px;font-family:var(--font);font-weight:900;font-size:.76rem;cursor:pointer;white-space:nowrap;}
.save-btn.saved{background:var(--green);color:#04160b;}

/* -------- precios -------- */
.price-row{display:flex;align-items:center;gap:10px;background:linear-gradient(160deg,var(--bg-2),var(--bg-1));
  border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:13px 14px;margin-bottom:10px;}
.price-name{flex:1;font-weight:900;font-size:.9rem;}
.price-input{width:90px;background:var(--bg-0);border:1px solid rgba(255,255,255,.15);border-radius:5px;
  padding:9px 10px;color:var(--ink);font-family:var(--font);font-size:.9rem;text-align:right;}
.price-save{background:linear-gradient(135deg,var(--orange-2),var(--orange));color:#1A0500;border:none;
  border-radius:5px;padding:9px 14px;font-weight:900;font-size:.75rem;text-transform:uppercase;cursor:pointer;}
.price-save.saved{background:var(--green);color:#04160b;}

.msg{text-align:center;color:var(--muted);font-size:.85rem;padding:30px;}
.denied{text-align:center;padding:80px 20px;}
.denied h1{font-size:1.2rem;margin-bottom:10px;}
.denied a{color:var(--orange-2);font-weight:800;}

/* -------- menú ☰ compartido (todas las funciones) -------- */
.hdr-actions{display:flex;align-items:center;gap:.6rem;}
.hdr-greet{font-size:.78rem;font-weight:900;color:var(--orange-2);white-space:nowrap;}
.navtog{display:flex;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:8px;
  width:36px;height:36px;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;flex:none;}
.navtog span{width:16px;height:2.5px;background:#FF6347;border-radius:2px;}
.nav{position:fixed;inset:0 0 auto 0;width:100%;background:var(--bg-1);
  padding:5.5rem 1.6rem 2.4rem;transform:translateY(-100%);transition:transform .32s ease;
  border-bottom:2px solid var(--orange);max-height:100vh;overflow-y:auto;z-index:299;}
.nav.open{transform:translateY(0);}
.nav-close{position:absolute;top:1rem;right:1.2rem;width:38px;height:38px;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.18);border-radius:8px;color:var(--ink);font-size:1.3rem;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;}
.nav-section{max-width:520px;margin:0 auto 1.6rem;}
.nav-section-title{font-size:.68rem;font-weight:900;text-transform:uppercase;letter-spacing:.12em;
  color:var(--muted);margin-bottom:.8rem;}
.nav-link{display:block;width:100%;text-align:left;background:none;border:none;font-family:inherit;
  font-size:1.02rem;font-weight:800;color:var(--ink-dim);padding:.65rem 0;cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,.06);}
.nav-link:hover{color:var(--orange-2);}
.nav-link--danger:hover{color:#ff8080;}
.nav-account-email{font-size:.78rem;color:var(--muted);padding-bottom:.6rem;word-break:break-all;}

/* -------- filtros de transacciones -------- */
.admin-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.filter-chip{background:var(--bg-1);border:1px solid rgba(255,255,255,.15);color:var(--ink-dim);
  border-radius:20px;padding:8px 14px;font-family:var(--font);font-size:.76rem;font-weight:800;cursor:pointer;white-space:nowrap;}
.filter-chip.active{background:linear-gradient(135deg,var(--orange-2),var(--orange));border-color:transparent;color:#1A0500;}
.filter-date{background:var(--bg-1);border:1px solid rgba(255,255,255,.15);border-radius:20px;color:var(--ink);
  font-family:var(--font);font-size:.76rem;font-weight:800;padding:8px 12px;}
.filter-empty{text-align:center;color:var(--muted);padding:24px;font-size:.82rem;}

/* -------- eliminar -------- */
.delete-btn{margin-top:10px;background:rgba(255,59,59,.1);border:1px solid rgba(255,59,59,.3);color:#ff8080;
  border-radius:6px;padding:8px 14px;font-family:var(--font);font-weight:800;font-size:.76rem;cursor:pointer;}
.delete-btn:hover{background:rgba(255,59,59,.18);}
</style>
</head>
<body>

<div id="authGate" style="position:fixed;inset:0;background:#07040A;z-index:999;display:flex;align-items:center;justify-content:center;color:#8B87A6;">Verificando acceso…</div>

<header class="hdr">
  <a href="index.html"><img src="logo.png" alt="FariPlay" class="brand-logo" onerror="this.style.display='none'"></a>
  <div class="hdr-actions">
    <span class="hdr-greet" id="hdrGreet">Admin</span>
    <button class="navtog" id="navtog" aria-label="Menú" aria-expanded="false"><span></span><span></span><span></span></button>
  </div>
</header>

<nav class="nav" id="nav">
  <button class="nav-close" id="navClose" aria-label="Cerrar menú">✕</button>
  <div class="nav-section">
    <p class="nav-section-title">Explorar</p>
    <a href="index.html" class="nav-link">Inicio</a>
    <a href="index.html#paquetes" class="nav-link">Paquetes</a>
  </div>
  <div class="nav-section">
    <p class="nav-section-title">Mi cuenta</p>
    <p class="nav-account-email" id="navAccountEmail"></p>
    <a href="perfil.html" class="nav-link">Mi perfil</a>
    <a href="mis-pedidos.html" class="nav-link">Mis pedidos</a>
    <a href="recargar.html" class="nav-link">Recargar saldo</a>
    <a href="admin.html" class="nav-link">Panel admin</a>
    <button type="button" class="nav-link nav-link--danger" id="navSalirBtn">Cerrar sesión</button>
  </div>
</nav>

<div class="wrap" id="appWrap" style="display:none;">
  <div class="tabs">
    <div class="tab active" data-tab="pedidos">Pedidos</div>
    <div class="tab" data-tab="recargas">Recargas</div>
    <div class="tab" data-tab="precios">Precios</div>
  </div>

  <div class="panel active" id="panelPedidos">
    <div class="admin-filters">
      <button type="button" class="filter-chip active" data-panel="ped" data-filter="hoy">Hoy</button>
      <button type="button" class="filter-chip" data-panel="ped" data-filter="pendientes">Por confirmar</button>
      <button type="button" class="filter-chip" data-panel="ped" data-filter="todos">Todos</button>
      <input type="date" class="filter-date" id="pedFecha" data-panel="ped">
    </div>
    <div id="ordersList"><p class="msg">Cargando pedidos…</p></div>
  </div>

  <div class="panel" id="panelRecargas">
    <div class="admin-filters">
      <button type="button" class="filter-chip active" data-panel="rec" data-filter="hoy">Hoy</button>
      <button type="button" class="filter-chip" data-panel="rec" data-filter="pendientes">Por confirmar</button>
      <button type="button" class="filter-chip" data-panel="rec" data-filter="todos">Todos</button>
      <input type="date" class="filter-date" id="recFecha" data-panel="rec">
    </div>
    <div id="recargasList"><p class="msg">Cargando recargas…</p></div>
  </div>

  <div class="panel" id="panelPrecios">
    <div id="pricesList"><p class="msg">Cargando precios…</p></div>
  </div>
</div>

<div id="deniedWrap" style="display:none;" class="wrap denied">
  <h1>Esta sección es solo para el administrador</h1>
  <p><a href="index.html">← Volver a la tienda</a></p>
</div>

<script>
const ADMIN_EMAIL = "hfarinango2707@gmail.com";
const SUPABASE_URL = "https://zdefkvvodijmrlhxvlrr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_C0ur5kEiRQ0TYDpgtiaF8Q_w2lCVCQA";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

(async function init(){
  const { data: { session } } = await sb.auth.getSession();
  const gate = document.getElementById("authGate");

  if (!session) { location.href = "auth.html?redirect=admin.html"; return; }

  if (session.user.email !== ADMIN_EMAIL) {
    gate.style.display = "none";
    document.getElementById("deniedWrap").style.display = "block";
    return;
  }

  document.getElementById("navAccountEmail").textContent = session.user.email;

  gate.style.display = "none";
  document.getElementById("appWrap").style.display = "block";
  cargarPedidos();
  cargarRecargas();
  cargarPrecios();
})();

document.getElementById("navSalirBtn").addEventListener("click", async () => {
  await sb.auth.signOut();
  location.href = "index.html";
});

const navEl = document.getElementById("nav");
const navtogBtn = document.getElementById("navtog");
navtogBtn.addEventListener("click", () => {
  const open = navEl.classList.toggle("open");
  navtogBtn.setAttribute("aria-expanded", open);
});
document.getElementById("navClose").addEventListener("click", () => navEl.classList.remove("open"));
navEl.addEventListener("click", (e) => { if (e.target.closest("a")) navEl.classList.remove("open"); });

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById("panel" + tab.dataset.tab.charAt(0).toUpperCase() + tab.dataset.tab.slice(1)).classList.add("active");
  });
});

/* -------- pedidos -------- */
let TODOS_LOS_PEDIDOS_ADMIN = [];
let pedFiltro = "hoy", pedFechaCustom = "";

function renderPedidos(pedidos){
  const list = document.getElementById("ordersList");
  if (!pedidos.length) { list.innerHTML = '<p class="filter-empty">No hay pedidos con este filtro.</p>'; return; }

  list.innerHTML = pedidos.map(p => {
    const fecha = new Date(p.created_at).toLocaleString("es-EC", { dateStyle: "short", timeStyle: "short" });
    const estado = p.estado || "pendiente";
    const clientId = "FP-" + String(p.user_id || "").slice(0,6).toUpperCase();
    return `
      <div class="order" data-id="${p.id}">
        <div class="order-top" onclick="this.parentElement.classList.toggle('open')">
          <div class="order-toggle">
            <svg class="chev" viewBox="0 0 12 8" fill="none"><path d="M1 1l5 5 5-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <div>
              <div class="order-pkg">${p.paquete}${p.bono > 0 ? ' (+' + p.bono + ')' : ''}</div>
              <div class="order-meta">${fecha} · ID jugador: ${p.player_id}</div>
              <span class="badge ${estado}">${estado}</span>
            </div>
          </div>
          <div class="order-total">$${Number(p.total).toFixed(2)}</div>
        </div>

        <div class="order-detail">
          <div class="detail-row"><span>Cliente</span><b>${clientId}${p.user_email ? ' · ' + p.user_email : ''}</b></div>
          <div class="detail-row"><span>Paquete</span><b>${p.paquete}${p.bono > 0 ? ' (+' + p.bono + ' bono)' : ''}</b></div>
          <div class="detail-row"><span>ID de jugador</span><b>${p.player_id}</b></div>
          <div class="detail-row"><span>Método de pago</span><b>${p.metodo_pago || '—'}</b></div>
          <div class="detail-row"><span>Banco</span><b>${p.banco || '—'}</b></div>
          ${p.codigo_cupon ? `<div class="detail-row"><span>Cupón</span><b>${p.codigo_cupon} (-$${Number(p.descuento||0).toFixed(2)})</b></div>` : ''}
          <div class="detail-row"><span>Total</span><b>$${Number(p.total).toFixed(2)}</b></div>
          <div class="detail-row"><span>Fecha</span><b>${fecha}</b></div>
          ${p.comprobante_url ? `<a href="${p.comprobante_url}" target="_blank" rel="noopener"><img src="${p.comprobante_url}" class="detail-img" alt="Comprobante"></a>` : '<p class="detail-row"><span>Comprobante</span><b>—</b></p>'}

          <button type="button" class="edit-toggle" data-id="${p.id}">✏️ Editar estado</button>
          <div class="edit-panel" data-id="${p.id}">
            <select class="edit-select">
              <option value="pendiente" ${estado === "pendiente" ? "selected" : ""}>Pendiente</option>
              <option value="confirmado" ${estado === "confirmado" ? "selected" : ""}>Confirmado</option>
              <option value="entregado" ${estado === "entregado" ? "selected" : ""}>Entregado</option>
            </select>
            <button type="button" class="save-btn" data-id="${p.id}" data-tabla="pedidos">Guardar</button>
          </div>
          <button type="button" class="delete-btn" data-id="${p.id}" data-tabla="pedidos">🗑 Eliminar pedido</button>
        </div>
      </div>`;
  }).join("");

  wireEditButtons(list);
  wireDeleteButtons(list, "pedidos");
}

function aplicarFiltroPedidos(){
  document.getElementById("pedFecha").value = pedFiltro === "fecha" ? pedFechaCustom : "";
  let arr = TODOS_LOS_PEDIDOS_ADMIN;
  if (pedFiltro === "hoy") {
    const hoy = new Date().toDateString();
    arr = arr.filter(p => new Date(p.created_at).toDateString() === hoy);
  } else if (pedFiltro === "pendientes") {
    arr = arr.filter(p => (p.estado || "pendiente") === "pendiente");
  } else if (pedFiltro === "fecha" && pedFechaCustom) {
    arr = arr.filter(p => new Date(p.created_at).toLocaleDateString("en-CA") === pedFechaCustom);
  }
  renderPedidos(arr);
}

async function cargarPedidos(){
  const { data: pedidos, error } = await sb.from("pedidos").select("*").order("created_at", { ascending: false }).limit(300);
  if (error) { document.getElementById("ordersList").innerHTML = '<p class="msg">No se pudieron cargar los pedidos.</p>'; return; }
  TODOS_LOS_PEDIDOS_ADMIN = pedidos || [];
  aplicarFiltroPedidos();
}

/* -------- recargas -------- */
let TODAS_LAS_RECARGAS_ADMIN = [];
let recFiltro = "hoy", recFechaCustom = "";

function renderRecargas(recargas){
  const list = document.getElementById("recargasList");
  if (!recargas.length) { list.innerHTML = '<p class="filter-empty">No hay recargas con este filtro.</p>'; return; }

  list.innerHTML = recargas.map(r => {
    const fecha = new Date(r.created_at).toLocaleString("es-EC", { dateStyle: "short", timeStyle: "short" });
    const estado = r.estado || "pendiente";
    const clientId = "FP-" + String(r.user_id || "").slice(0,6).toUpperCase();
    return `
      <div class="order" data-id="${r.id}">
        <div class="order-top" onclick="this.parentElement.classList.toggle('open')">
          <div class="order-toggle">
            <svg class="chev" viewBox="0 0 12 8" fill="none"><path d="M1 1l5 5 5-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <div>
              <div class="order-pkg">$${Number(r.monto).toFixed(2)}</div>
              <div class="order-meta">${fecha} · ${r.banco || ''}</div>
              <span class="badge ${estado}">${estado}</span>
            </div>
          </div>
        </div>

        <div class="order-detail">
          <div class="detail-row"><span>Cliente</span><b>${clientId}${r.user_email ? ' · ' + r.user_email : ''}</b></div>
          <div class="detail-row"><span>Monto</span><b>$${Number(r.monto).toFixed(2)}</b></div>
          <div class="detail-row"><span>Método</span><b>${r.metodo_pago || '—'}</b></div>
          <div class="detail-row"><span>Banco</span><b>${r.banco || '—'}</b></div>
          <div class="detail-row"><span>N° de comprobante</span><b>${r.numero_comprobante || '—'}</b></div>
          ${r.observacion ? `<div class="detail-row"><span>Observación</span><b>${r.observacion}</b></div>` : ''}
          <div class="detail-row"><span>Reportado</span><b>${fecha}</b></div>
          ${r.comprobante_url ? `<a href="${r.comprobante_url}" target="_blank" rel="noopener"><img src="${r.comprobante_url}" class="detail-img" alt="Comprobante"></a>` : '<p class="detail-row"><span>Comprobante</span><b>—</b></p>'}

          <button type="button" class="edit-toggle" data-id="${r.id}">✏️ Editar estado</button>
          <div class="edit-panel" data-id="${r.id}">
            <select class="edit-select">
              <option value="pendiente" ${estado === "pendiente" ? "selected" : ""}>Pendiente</option>
              <option value="confirmado" ${estado === "confirmado" ? "selected" : ""}>Confirmado</option>
              <option value="rechazado" ${estado === "rechazado" ? "selected" : ""}>Rechazado</option>
            </select>
            <button type="button" class="save-btn" data-id="${r.id}" data-tabla="recargas">Guardar</button>
          </div>
          <button type="button" class="delete-btn" data-id="${r.id}" data-tabla="recargas">🗑 Eliminar recarga</button>
        </div>
      </div>`;
  }).join("");

  wireEditButtons(list);
  wireDeleteButtons(list, "recargas");
}

function aplicarFiltroRecargas(){
  document.getElementById("recFecha").value = recFiltro === "fecha" ? recFechaCustom : "";
  let arr = TODAS_LAS_RECARGAS_ADMIN;
  if (recFiltro === "hoy") {
    const hoy = new Date().toDateString();
    arr = arr.filter(r => new Date(r.created_at).toDateString() === hoy);
  } else if (recFiltro === "pendientes") {
    arr = arr.filter(r => (r.estado || "pendiente") === "pendiente");
  } else if (recFiltro === "fecha" && recFechaCustom) {
    arr = arr.filter(r => new Date(r.created_at).toLocaleDateString("en-CA") === recFechaCustom);
  }
  renderRecargas(arr);
}

async function cargarRecargas(){
  const { data: recargas, error } = await sb.from("recargas").select("*").order("created_at", { ascending: false }).limit(300);
  if (error) { document.getElementById("recargasList").innerHTML = '<p class="msg">No se pudieron cargar las recargas (¿ya creaste la tabla "recargas" en Supabase?).</p>'; return; }
  TODAS_LAS_RECARGAS_ADMIN = recargas || [];
  aplicarFiltroRecargas();
}

/* -------- chips y fecha de filtro -------- */
document.querySelectorAll(".filter-chip").forEach(chip => {
  chip.addEventListener("click", () => {
    const panel = chip.dataset.panel;
    document.querySelectorAll('.filter-chip[data-panel="' + panel + '"]').forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    if (panel === "ped") { pedFiltro = chip.dataset.filter; pedFechaCustom = ""; aplicarFiltroPedidos(); }
    else { recFiltro = chip.dataset.filter; recFechaCustom = ""; aplicarFiltroRecargas(); }
  });
});

document.getElementById("pedFecha").addEventListener("change", function(){
  pedFechaCustom = this.value;
  pedFiltro = this.value ? "fecha" : "hoy";
  document.querySelectorAll('.filter-chip[data-panel="ped"]').forEach(c => c.classList.remove("active"));
  aplicarFiltroPedidos();
});
document.getElementById("recFecha").addEventListener("change", function(){
  recFechaCustom = this.value;
  recFiltro = this.value ? "fecha" : "hoy";
  document.querySelectorAll('.filter-chip[data-panel="rec"]').forEach(c => c.classList.remove("active"));
  aplicarFiltroRecargas();
});

/* -------- editar / guardar estado (compartido) -------- */
function wireEditButtons(list){
  list.querySelectorAll(".edit-toggle").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const panel = list.querySelector('.edit-panel[data-id="' + btn.dataset.id + '"]');
      panel.classList.toggle("open");
    });
  });

  list.querySelectorAll(".save-btn").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      const panel = btn.closest(".edit-panel");
      const nuevoEstado = panel.querySelector(".edit-select").value;
      const tabla = btn.dataset.tabla;
      const id = btn.dataset.id;

      btn.textContent = "Guardando…";
      const { error } = await sb.from(tabla).update({ estado: nuevoEstado }).eq("id", id);
      btn.textContent = error ? "Error" : "✓ Guardado";
      if (!error) {
        btn.classList.add("saved");
        const card = list.querySelector('.order[data-id="' + id + '"]');
        const badge = card.querySelector(".badge");
        badge.textContent = nuevoEstado;
        badge.className = "badge " + nuevoEstado;
        // actualiza también la caché en memoria
        const cache = tabla === "pedidos" ? TODOS_LOS_PEDIDOS_ADMIN : TODAS_LAS_RECARGAS_ADMIN;
        const item = cache.find(x => String(x.id) === String(id));
        if (item) item.estado = nuevoEstado;
      }
      setTimeout(() => { btn.textContent = "Guardar"; btn.classList.remove("saved"); panel.classList.remove("open"); }, 1200);
    });
  });
}

/* -------- eliminar (compartido) -------- */
function wireDeleteButtons(list, tabla){
  list.querySelectorAll(".delete-btn").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      const id = btn.dataset.id;
      const etiqueta = tabla === "pedidos" ? "este pedido" : "esta recarga";
      if (!confirm("¿Seguro que quieres eliminar " + etiqueta + "? Esta acción no se puede deshacer.")) return;

      btn.textContent = "Eliminando…";
      btn.disabled = true;
      const { error } = await sb.from(tabla).delete().eq("id", id);
      if (error) {
        btn.textContent = "🗑 Error, reintenta";
        btn.disabled = false;
        return;
      }
      if (tabla === "pedidos") {
        TODOS_LOS_PEDIDOS_ADMIN = TODOS_LOS_PEDIDOS_ADMIN.filter(x => String(x.id) !== String(id));
      } else {
        TODAS_LAS_RECARGAS_ADMIN = TODAS_LAS_RECARGAS_ADMIN.filter(x => String(x.id) !== String(id));
      }
      const card = list.querySelector('.order[data-id="' + id + '"]');
      if (card) card.remove();
    });
  });
}

/* -------- precios -------- */
async function cargarPrecios(){
  const { data: precios, error } = await sb.from("precios").select("*").order("orden", { ascending: true });
  const list = document.getElementById("pricesList");
  if (error) { list.innerHTML = '<p class="msg">No se pudieron cargar los precios.</p>'; return; }

  list.innerHTML = precios.map(p => `
    <div class="price-row">
      <span class="price-name">${p.id} 💎${p.bono > 0 ? ' <small>(+' + p.bono + ')</small>' : ''}</span>
      <input type="number" step="0.01" class="price-input" data-id="${p.id}" value="${p.precio}">
      <button class="price-save" data-id="${p.id}">Guardar</button>
    </div>`).join("");

  list.querySelectorAll(".price-save").forEach(btn => {
    btn.addEventListener("click", async () => {
      const input = list.querySelector('.price-input[data-id="' + btn.dataset.id + '"]');
      const nuevoPrecio = parseFloat(input.value);
      if (isNaN(nuevoPrecio) || nuevoPrecio <= 0) { alert("Precio inválido."); return; }
      btn.textContent = "Guardando…";
      const { error } = await sb.from("precios").update({ precio: nuevoPrecio, updated_at: new Date().toISOString() }).eq("id", btn.dataset.id);
      btn.textContent = error ? "Error" : "✓ Guardado";
      if (!error) btn.classList.add("saved");
      setTimeout(() => { btn.textContent = "Guardar"; btn.classList.remove("saved"); }, 1800);
    });
  });
}
</script>
