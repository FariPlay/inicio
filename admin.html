<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel — FariPlay</title>
<meta name="theme-color" content="#07040A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%2307040A'/%3E%3Cpolygon points='14,12 34,12 50,52 30,52' fill='%23FF7A1A'/%3E%3Cpolygon points='50,12 30,12 14,52 34,52' fill='%233A5CFF'/%3E%3C/svg%3E" type="image/svg+xml">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg-0:#07040A; --bg-1:#120B18; --bg-2:#1B1024;
  --blue:#3A5CFF; --blue-2:#5B7CFF; --orange:#FF7A1A; --orange-2:#FFB238;
  --ink:#FFFFFF; --ink-dim:#C9C6DA; --muted:#8B87A6; --green:#3ECF6E; --red:#FF3B3B;
  --font:Arial,Helvetica,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg-0);color:var(--ink);font-family:var(--font);min-height:100vh;min-height:100dvh;position:relative;overflow-x:hidden;}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,122,26,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,122,26,.035) 1px,transparent 1px);
  background-size:38px 38px;}
a{color:inherit;text-decoration:none;}
.hdr{background:rgba(7,4,10,.92);backdrop-filter:blur(16px);position:sticky;top:0;z-index:100;height:58px;
  padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--orange);}
.brand-logo{height:26px;width:auto;}
.logout{font-size:.78rem;color:var(--muted);}
.wrap{max-width:640px;margin:0 auto;padding:22px 16px 60px;position:relative;z-index:1;}

.tabs{display:flex;gap:6px;margin-bottom:20px;background:var(--bg-1);border-radius:6px;padding:4px;}
.tab{flex:1;text-align:center;padding:11px;border-radius:5px;font-size:.78rem;font-weight:900;text-transform:uppercase;
  letter-spacing:.5px;cursor:pointer;color:var(--muted);}
.tab.active{background:linear-gradient(135deg,var(--orange-2),var(--orange));color:#1A0500;}
.panel{display:none;}
.panel.active{display:block;}

/* -------- pedidos -------- */
.order{background:linear-gradient(160deg,var(--bg-2),var(--bg-1));border:1px solid rgba(255,255,255,.08);
  border-left:3px solid var(--orange);border-radius:6px;padding:15px 16px;margin-bottom:10px;}
.order-top{display:flex;justify-content:space-between;gap:10px;}
.order-pkg{font-weight:900;font-size:.98rem;}
.order-total{font-weight:900;color:var(--orange-2);}
.order-meta{font-size:.74rem;color:var(--muted);margin-top:6px;line-height:1.6;}
.order-meta a{color:var(--blue-2);font-weight:800;}
.estado-select{margin-top:10px;width:100%;background:var(--bg-0);border:1px solid rgba(255,255,255,.15);
  border-radius:5px;padding:9px 10px;color:var(--ink);font-family:var(--font);font-size:.8rem;font-weight:800;}

/* -------- precios -------- */
.price-row{display:flex;align-items:center;gap:10px;background:linear-gradient(160deg,var(--bg-2),var(--bg-1));
  border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:13px 14px;margin-bottom:10px;}
.price-name{flex:1;font-weight:900;font-size:.9rem;}
.price-input{width:90px;background:var(--bg-0);border:1px solid rgba(255,255,255,.15);border-radius:5px;
  padding:9px 10px;color:var(--ink);font-family:var(--font);font-size:.9rem;text-align:right;}
.price-save{background:linear-gradient(135deg,var(--orange-2),var(--orange));color:#1A0500;border:none;
  border-radius:5px;padding:9px 14px;font-weight:900;font-size:.75rem;text-transform:uppercase;cursor:pointer;}
.price-save.saved{background:var(--green);color:#04160b;}

.msg{text-align:center;color:var(--muted);font-size:.85rem;padding:30px;}
.denied{text-align:center;padding:80px 20px;}
.denied h1{font-size:1.2rem;margin-bottom:10px;}
.denied a{color:var(--orange-2);font-weight:800;}

/* -------- menú ☰ compartido (todas las funciones) -------- */
.hdr-actions{display:flex;align-items:center;gap:.6rem;}
.hdr-greet{font-size:.78rem;font-weight:900;color:var(--orange-2);white-space:nowrap;}
.navtog{display:flex;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:8px;
  width:36px;height:36px;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;flex:none;}
.navtog span{width:16px;height:2.5px;background:#FF6347;border-radius:2px;}
.nav{position:fixed;inset:0 0 auto 0;width:100%;background:var(--bg-1);
  padding:5.5rem 1.6rem 2.4rem;transform:translateY(-100%);transition:transform .32s ease;
  border-bottom:2px solid var(--orange);max-height:100vh;overflow-y:auto;z-index:299;}
.nav.open{transform:translateY(0);}
.nav-close{position:absolute;top:1rem;right:1.2rem;width:38px;height:38px;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.18);border-radius:8px;color:var(--ink);font-size:1.3rem;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;}
.nav-section{max-width:520px;margin:0 auto 1.6rem;}
.nav-section-title{font-size:.68rem;font-weight:900;text-transform:uppercase;letter-spacing:.12em;
  color:var(--muted);margin-bottom:.8rem;}
.nav-link{display:block;width:100%;text-align:left;background:none;border:none;font-family:inherit;
  font-size:1.02rem;font-weight:800;color:var(--ink-dim);padding:.65rem 0;cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,.06);}
.nav-link:hover{color:var(--orange-2);}
.nav-link--danger:hover{color:#ff8080;}
.nav-account-email{font-size:.78rem;color:var(--muted);padding-bottom:.6rem;word-break:break-all;}
</style>
</head>
<body>

<div id="authGate" style="position:fixed;inset:0;background:#07040A;z-index:999;display:flex;align-items:center;justify-content:center;color:#8B87A6;">Verificando acceso…</div>

<header class="hdr">
  <a href="index.html"><img src="logo.png" alt="FariPlay" class="brand-logo" onerror="this.style.display='none'"></a>
  <div class="hdr-actions">
    <span class="hdr-greet" id="hdrGreet">Admin</span>
    <button class="navtog" id="navtog" aria-label="Menú" aria-expanded="false"><span></span><span></span><span></span></button>
  </div>
</header>

<nav class="nav" id="nav">
  <button class="nav-close" id="navClose" aria-label="Cerrar menú">✕</button>
  <div class="nav-section">
    <p class="nav-section-title">Explorar</p>
    <a href="index.html" class="nav-link">Inicio</a>
    <a href="index.html#paquetes" class="nav-link">Paquetes</a>
  </div>
  <div class="nav-section">
    <p class="nav-section-title">Mi cuenta</p>
    <p class="nav-account-email" id="navAccountEmail"></p>
    <a href="perfil.html" class="nav-link">Mi perfil</a>
    <a href="mis-pedidos.html" class="nav-link">Mis pedidos</a>
    <a href="recargar.html" class="nav-link">Recargar saldo</a>
    <a href="admin.html" class="nav-link">Panel admin</a>
    <button type="button" class="nav-link nav-link--danger" id="navSalirBtn">Cerrar sesión</button>
  </div>
</nav>

<div class="wrap" id="appWrap" style="display:none;">
  <div class="tabs">
    <div class="tab active" data-tab="pedidos">Pedidos</div>
    <div class="tab" data-tab="recargas">Recargas</div>
    <div class="tab" data-tab="precios">Precios</div>
  </div>

  <div class="panel active" id="panelPedidos">
    <div id="ordersList"><p class="msg">Cargando pedidos…</p></div>
  </div>

  <div class="panel" id="panelRecargas">
    <div id="recargasList"><p class="msg">Cargando recargas…</p></div>
  </div>

  <div class="panel" id="panelPrecios">
    <div id="pricesList"><p class="msg">Cargando precios…</p></div>
  </div>
</div>

<div id="deniedWrap" style="display:none;" class="wrap denied">
  <h1>Esta sección es solo para el administrador</h1>
  <p><a href="index.html">← Volver a la tienda</a></p>
</div>

<script>
const ADMIN_EMAIL = "hfarinango2707@gmail.com";
const SUPABASE_URL = "https://zdefkvvodijmrlhxvlrr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_C0ur5kEiRQ0TYDpgtiaF8Q_w2lCVCQA";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

(async function init(){
  const { data: { session } } = await sb.auth.getSession();
  const gate = document.getElementById("authGate");

  if (!session) { location.href = "auth.html?redirect=admin.html"; return; }

  if (session.user.email !== ADMIN_EMAIL) {
    gate.style.display = "none";
    document.getElementById("deniedWrap").style.display = "block";
    return;
  }

  document.getElementById("navAccountEmail").textContent = session.user.email;

  gate.style.display = "none";
  document.getElementById("appWrap").style.display = "block";
  cargarPedidos();
  cargarRecargas();
  cargarPrecios();
})();

document.getElementById("navSalirBtn").addEventListener("click", async () => {
  await sb.auth.signOut();
  location.href = "index.html";
});

const navEl = document.getElementById("nav");
const navtogBtn = document.getElementById("navtog");
navtogBtn.addEventListener("click", () => {
  const open = navEl.classList.toggle("open");
  navtogBtn.setAttribute("aria-expanded", open);
});
document.getElementById("navClose").addEventListener("click", () => navEl.classList.remove("open"));
navEl.addEventListener("click", (e) => { if (e.target.closest("a")) navEl.classList.remove("open"); });

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById("panel" + tab.dataset.tab.charAt(0).toUpperCase() + tab.dataset.tab.slice(1)).classList.add("active");
  });
});

/* -------- pedidos -------- */
async function cargarPedidos(){
  const { data: pedidos, error } = await sb.from("pedidos").select("*").order("created_at", { ascending: false }).limit(80);
  const list = document.getElementById("ordersList");
  if (error) { list.innerHTML = '<p class="msg">No se pudieron cargar los pedidos.</p>'; return; }
  if (!pedidos.length) { list.innerHTML = '<p class="msg">Todavía no hay pedidos.</p>'; return; }

  list.innerHTML = pedidos.map(p => {
    const fecha = new Date(p.created_at).toLocaleString("es-EC", { dateStyle: "short", timeStyle: "short" });
    return `
      <div class="order">
        <div class="order-top">
          <div>
            <div class="order-pkg">${p.paquete}${p.bono > 0 ? ' (+' + p.bono + ')' : ''}</div>
            <div class="order-meta">
              ${fecha} · ID: ${p.player_id} · ${p.metodo_pago || ''}${p.banco ? ' · ' + p.banco : ''}
              ${p.comprobante_url ? '<br><a href="' + p.comprobante_url + '" target="_blank" rel="noopener">Ver comprobante →</a>' : ''}
            </div>
          </div>
          <div class="order-total">$${Number(p.total).toFixed(2)}</div>
        </div>
        <select class="estado-select" data-id="${p.id}">
          <option value="pendiente" ${p.estado === "pendiente" ? "selected" : ""}>Pendiente</option>
          <option value="confirmado" ${p.estado === "confirmado" ? "selected" : ""}>Confirmado</option>
          <option value="entregado" ${p.estado === "entregado" ? "selected" : ""}>Entregado</option>
        </select>
      </div>`;
  }).join("");

  list.querySelectorAll(".estado-select").forEach(sel => {
    sel.addEventListener("change", async () => {
      await sb.from("pedidos").update({ estado: sel.value }).eq("id", sel.dataset.id);
    });
  });
}

/* -------- recargas -------- */
async function cargarRecargas(){
  const { data: recargas, error } = await sb.from("recargas").select("*").order("created_at", { ascending: false }).limit(100);
  const list = document.getElementById("recargasList");
  if (error) { list.innerHTML = '<p class="msg">No se pudieron cargar las recargas (¿ya creaste la tabla "recargas" en Supabase?).</p>'; return; }
  if (!recargas.length) { list.innerHTML = '<p class="msg">Todavía no hay recargas.</p>'; return; }

  list.innerHTML = recargas.map(r => {
    const fecha = new Date(r.created_at).toLocaleString("es-EC", { dateStyle: "short", timeStyle: "short" });
    return `
      <div class="order">
        <div class="order-top">
          <div>
            <div class="order-pkg">$${Number(r.monto).toFixed(2)}</div>
            <div class="order-meta">
              ${fecha} · ${r.metodo_pago || ''}${r.banco ? ' · ' + r.banco : ''} · usuario: ${r.user_id.slice(0,8)}…
              ${r.comprobante_url ? '<br><a href="' + r.comprobante_url + '" target="_blank" rel="noopener">Ver comprobante →</a>' : ''}
            </div>
          </div>
        </div>
        <select class="estado-select" data-id="${r.id}" data-tabla="recargas">
          <option value="pendiente" ${r.estado === "pendiente" ? "selected" : ""}>Pendiente</option>
          <option value="confirmado" ${r.estado === "confirmado" ? "selected" : ""}>Confirmado</option>
          <option value="rechazado" ${r.estado === "rechazado" ? "selected" : ""}>Rechazado</option>
        </select>
      </div>`;
  }).join("");

  list.querySelectorAll(".estado-select").forEach(sel => {
    sel.addEventListener("change", async () => {
      await sb.from("recargas").update({ estado: sel.value }).eq("id", sel.dataset.id);
    });
  });
}

/* -------- precios -------- */
async function cargarPrecios(){
  const { data: precios, error } = await sb.from("precios").select("*").order("orden", { ascending: true });
  const list = document.getElementById("pricesList");
  if (error) { list.innerHTML = '<p class="msg">No se pudieron cargar los precios.</p>'; return; }

  list.innerHTML = precios.map(p => `
    <div class="price-row">
      <span class="price-name">${p.id} 💎${p.bono > 0 ? ' <small>(+' + p.bono + ')</small>' : ''}</span>
      <input type="number" step="0.01" class="price-input" data-id="${p.id}" value="${p.precio}">
      <button class="price-save" data-id="${p.id}">Guardar</button>
    </div>`).join("");

  list.querySelectorAll(".price-save").forEach(btn => {
    btn.addEventListener("click", async () => {
      const input = list.querySelector('.price-input[data-id="' + btn.dataset.id + '"]');
      const nuevoPrecio = parseFloat(input.value);
      if (isNaN(nuevoPrecio) || nuevoPrecio <= 0) { alert("Precio inválido."); return; }
      btn.textContent = "Guardando…";
      const { error } = await sb.from("precios").update({ precio: nuevoPrecio, updated_at: new Date().toISOString() }).eq("id", btn.dataset.id);
      btn.textContent = error ? "Error" : "✓ Guardado";
      if (!error) btn.classList.add("saved");
      setTimeout(() => { btn.textContent = "Guardar"; btn.classList.remove("saved"); }, 1800);
    });
  });
}
</script>
</body>
</html>
